
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrowdSense | Owner Signup</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #10131b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .signup-box {
            width: min(360px, 85%);
            padding: 30px;
            background: #1c2230;
            border-radius: 14px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border-radius: 7px;
            border: 1px solid #394355;
        }

        input {
            background: #101722;
            color: white;
        }

        button {
            background: #e63946;
            color: white;
            border: 0;
            cursor: pointer;
        }

        .error {
            color: #ff7373;
        }

        a {
            color: #e63946;
        }

        .password-wrapper {
            position: relative;
            margin-top: 14px;
        }

        .password-wrapper input {
            margin-top: 0;
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 5px;
            background: transparent;
            border: none;
            color: white;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h1>CrowdSense</h1>
        <p>Create your Location Owner Account</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input
                name="username"
                placeholder="Username"
                required
            >

            <input
                name="location_name"
                placeholder="Location name"
                required
            >

            <div class="password-wrapper">

                <input
                    name="password"
                    type="password"
                    class="password-input"
                    placeholder="Password (minimum 10 characters)"
                    minlength="10"
                    required
                >

                <button type="button"
                        class="toggle-password"
                        aria-label="Show password">👁</button>

            </div>

            <div class="password-wrapper">

                <input
                    name="confirm_password"
                    type="password"
                    class="password-input"
                    placeholder="Confirm password"
                    required
                >

                <button type="button"
                        class="toggle-password"
                        aria-label="Show password">👁</button>

            </div>

            <button type="submit">Create Account</button>


<label>Email Address</label>
<input
    type="email"
    name="email"
    placeholder="Enter your email address"
    required
>


        </form>

        <p>Already registered? <a href="/login">Login</a></p>

    </div>

    <script>
    document.querySelectorAll(".toggle-password").forEach(function(button) {

        button.addEventListener("click", function() {

            const input = this.parentElement.querySelector(".password-input");

            if (input.type === "password") {
                input.type = "text";
                this.textContent = "🙈";
                this.setAttribute("aria-label", "Hide password");
            } else {
                input.type = "password";
                this.textContent = "👁";
                this.setAttribute("aria-label", "Show password");
            }

        });

    });
    </script>

</body>
</html>
